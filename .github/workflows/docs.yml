# .github/workflows/docs.yml -- construction de la documentation MkDocs
# (issue #282).
#
# - PR/push : mkdocs build --strict (bloquant sur lien mort)
# - le site HTML est conserve comme artefact du run (mkdocs-site), a
#   telecharger depuis l'onglet Actions pour le consulter hors ligne.
#
# Pas de publication GitHub Pages : Pages n'est pas active sur le depot
# (choix de la mainteneuse, 26/09/2026) et le job de deploiement echouait
# en 404 a chaque push sur main. La documentation se lit directement dans
# docs/ sur GitHub, ou en local : uv run --with mkdocs-material mkdocs serve

name: Documentation

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construction (mkdocs build --strict)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v7

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installation de mkdocs-material
        run: pip install mkdocs-material pymdown-extensions

      - name: Construction (strict -- echoue sur lien mort)
        run: mkdocs build --strict

      - name: Upload de l'artefact (site HTML)
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site/
