      description: 'Recherche forensique transversale sur une analyse terminee (issue
        #675,

        equivalent de ``--forensic-search`` et ``--search-*``).


        Critères en JSON : ``text``, ``point``, ``protocol``, ``address``,

        ``port``, ``time_start``, ``time_end``, ``field``, ``field_value``.


        409 si l''analyse a ete relue depuis SQLite apres un redemarrage.'
      operationId: forensic_search_analyses__analysis_id__search_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
