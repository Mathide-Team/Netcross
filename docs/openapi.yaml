openapi: 3.1.0
info:
  title: Netcross API
  description: Analyse croisée de captures réseau — service REST
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - meta
      summary: Health
      description: Health check du service.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /captures:
    post:
      tags:
      - captures
      summary: Upload Capture
      description: 'Upload d''un fichier pcap, analyse en tâche de fond.


        Réponse 202 ``{"status": "pending"}`` : suivre ``status_url`` jusqu''à

        ``completed`` (ou ``failed`` avec ``error``). ``?wait=true`` attend la

        fin et retourne directement le résumé (201). ``nat_tolerant``,

        ``nat_window_ms``, ``tls``, ``quic``, ``redact``, ``bucket_ms``,

        ``rtp_clock_rate``, ``idle_timeout_seconds``, ``detect_duplicates``,

        ``exclude_duplicates`` et ``duplicate_threshold_ms`` ont le sens des

        options de même nom de la CLI (issue #330).'
      operationId: upload_capture_captures_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          description: 'true : attendre la fin de l''analyse (201 + résumé) au lieu
            de 202 + statut pending'
          default: false
          title: Wait
        description: 'true : attendre la fin de l''analyse (201 + résumé) au lieu
          de 202 + statut pending'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_capture_captures_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
        '201':
          description: Analyse terminée (?wait=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSummary'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Content Too Large
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /captures/multi:
    post:
      tags:
      - captures
      summary: Upload Multi Capture
      description: 'Upload de plusieurs captures étiquetées, analyse croisée entre
        points.


        Issue #354 : équivalent de ``netcross -f LAN=lan.pcap -f DC=dc.pcap

        --order LAN,DC``. ``labels`` donne une étiquette par fichier (dans

        l''ordre des fichiers) ; ``points_order`` (facultatif) fixe l''ordre

        amont -> aval, sinon il est déduit du trafic. Le résumé (``?wait=true``

        ou ``/status``) détaille les pertes et le délai de chaque segment.

        Options d''analyse : comme ``POST /captures`` (issue #330).


        Issue #474 lot 2 : un seul fichier est accepté, par exemple un pcapng

        multi-interfaces avec ``split_interfaces=true`` (un point par interface).'
      operationId: upload_multi_capture_captures_multi_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          description: 'true : attendre la fin de l''analyse (201 + résumé) au lieu
            de 202 + statut pending'
          default: false
          title: Wait
        description: 'true : attendre la fin de l''analyse (201 + résumé) au lieu
          de 202 + statut pending'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_multi_capture_captures_multi_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
        '201':
          description: Analyse terminée (?wait=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiAnalysisSummary'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Content Too Large
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}:
    get:
      tags:
      - analyses
      summary: Get Analysis
      description: 'Récupère le rapport complet d''une analyse terminée (JSON).


        Les clés par segment sont « amont -> aval » (voir ``store.jsonable``).'
      operationId: get_analysis_analyses__analysis_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/report:
    get:
      tags:
      - analyses
      summary: Get Analysis Report
      description: 'Rapport structuré d''une analyse terminée : le même document que

        ``netcross --json-report --security-report`` et que l''export JSON de la

        GUI (``findings``, ``triage``, ``health_score``, ``security_report``...).


        Issue #330 : ``GET /analyses/{analysis_id}`` sert la copie brute des

        mesures ; cette route sert les constats et le score de santé. 409 pour

        une analyse enregistrée avant l''ajout de cette route (à relancer).'
      operationId: get_analysis_report_analyses__analysis_id__report_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/security:
    get:
      tags:
      - analyses
      summary: Get Security Report
      description: Récupère les constats de sécurité d'une analyse terminée.
      operationId: get_security_report_analyses__analysis_id__security_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityReport'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses:
    get:
      tags:
      - analyses
      summary: List Analyses
      description: Liste les IDs d'analyses disponibles (tous statuts).
      operationId: list_analyses_analyses_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Analyses Analyses Get
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - APIKeyHeader: []
  /analyses/{analysis_id}/status:
    get:
      tags:
      - analyses
      summary: Get Analysis Status
      description: 'Statut d''une analyse (issue #356) : ``pending``, ``completed``
        (avec

        le résumé, segments compris en multi-points) ou ``failed`` (``error``).'
      operationId: get_analysis_status_analyses__analysis_id__status_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStatus'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AnalysisAccepted:
      properties:
        analysis_id:
          type: string
          title: Analysis Id
        status:
          type: string
          title: Status
          default: pending
        status_url:
          type: string
          title: Status Url
          description: Route à interroger jusqu'à completed/failed
      type: object
      required:
      - analysis_id
      - status_url
      title: AnalysisAccepted
      description: 'Réponse 202 des uploads : analyse enregistrée, en tâche de fond
        (#356).'
    AnalysisStatus:
      properties:
        analysis_id:
          type: string
          title: Analysis Id
        status:
          type: string
          title: Status
          description: pending, completed ou failed
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Cause de l'échec (status failed)
        summary:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Summary
          description: Résumé (compteurs, et points/segments en multi-points) une
            fois completed
      type: object
      required:
      - analysis_id
      - status
      title: AnalysisStatus
      description: 'Statut d''une analyse pour GET /analyses/{id}/status (issue #356).'
    AnalysisSummary:
      properties:
        analysis_id:
          type: string
          title: Analysis Id
        status:
          type: string
          title: Status
          default: completed
        point_count:
          type: integer
          title: Point Count
          default: 0
        packet_count:
          type: integer
          title: Packet Count
          default: 0
        security_finding_count:
          type: integer
          title: Security Finding Count
          default: 0
      type: object
      required:
      - analysis_id
      title: AnalysisSummary
      description: Résumé d'une analyse (retourné par POST /captures).
    Body_upload_capture_captures_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: Fichier pcap/pcapng à analyser
        label:
          type: string
          title: Label
          description: 'Étiquette du point de capture (ex: lan)'
          default: capture
        nat_tolerant:
          type: boolean
          title: Nat Tolerant
          description: 'true : corrélation tolérante au NAT (équivalent de --nat-tolerant)'
          default: false
        nat_window_ms:
          type: number
          exclusiveMinimum: 0.0
          title: Nat Window Ms
          description: Fenêtre de corrélation NAT en ms, avec nat_tolerant (équivalent
            de --nat-window-ms)
          default: 200.0
        tls:
          type: boolean
          title: Tls
          description: 'true : diagnostic TLS (équivalent de --tls)'
          default: false
        quic:
          type: boolean
          title: Quic
          description: 'true : diagnostic QUIC/HTTP3 (équivalent de --quic)'
          default: false
        redact:
          type: boolean
          title: Redact
          description: 'true : anonymise les adresses IP/MAC avant analyse (équivalent
            de --redact) ; incompatible avec tls/quic, et le rapport de sécurité n''est
            alors pas calculé'
          default: false
        bucket_ms:
          type: number
          exclusiveMinimum: 0.0
          title: Bucket Ms
          description: Fenêtre temporelle du débit en ms (équivalent de --bucket-ms)
          default: 1000
        rtp_clock_rate:
          type: integer
          exclusiveMinimum: 0.0
          title: Rtp Clock Rate
          description: Horloge RTP en Hz pour la gigue (équivalent de --rtp-clock-rate)
          default: 8000
        idle_timeout_seconds:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Idle Timeout Seconds
          description: Seuil de coupure NAT/pare-feu silencieuse en secondes, défaut
            du cœur (60 s) si absent (équivalent de --idle-timeout-seconds)
        detect_duplicates:
          type: boolean
          title: Detect Duplicates
          description: 'true : compte les doublons inter-captures (équivalent de --detect-duplicates)'
          default: false
        exclude_duplicates:
          type: boolean
          title: Exclude Duplicates
          description: 'true : exclut les doublons inter-captures de l''analyse (équivalent
            de --exclude-duplicates, implique detect_duplicates)'
          default: false
        duplicate_threshold_ms:
          type: number
          minimum: 0.0
          title: Duplicate Threshold Ms
          description: Écart maximal en ms entre deux copies d'un même paquet (équivalent
            de --duplicate-threshold-ms)
          default: 1.0
      type: object
      required:
      - file
      title: Body_upload_capture_captures_post
    Body_upload_multi_capture_captures_multi_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
          description: Fichiers pcap/pcapng à analyser
        labels:
          type: string
          title: Labels
          description: 'Étiquettes séparées par virgule (ex: lan,wan,dc)'
          default: ''
        points_order:
          type: string
          title: Points Order
          description: 'Ordre des points séparé par virgule (ex: lan,wan,dc)'
          default: ''
        nat_tolerant:
          type: boolean
          title: Nat Tolerant
          description: 'true : corrélation tolérante au NAT (équivalent de --nat-tolerant)'
          default: false
        nat_window_ms:
          type: number
          exclusiveMinimum: 0.0
          title: Nat Window Ms
          description: Fenêtre de corrélation NAT en ms, avec nat_tolerant (équivalent
            de --nat-window-ms)
          default: 200.0
        tls:
          type: boolean
          title: Tls
          description: 'true : diagnostic TLS (équivalent de --tls)'
          default: false
        quic:
          type: boolean
          title: Quic
          description: 'true : diagnostic QUIC/HTTP3 (équivalent de --quic)'
          default: false
        redact:
          type: boolean
          title: Redact
          description: 'true : anonymise les adresses IP/MAC avant analyse (équivalent
            de --redact) ; incompatible avec tls/quic, et le rapport de sécurité n''est
            alors pas calculé'
          default: false
        bucket_ms:
          type: number
          exclusiveMinimum: 0.0
          title: Bucket Ms
          description: Fenêtre temporelle du débit en ms (équivalent de --bucket-ms)
          default: 1000
        rtp_clock_rate:
          type: integer
          exclusiveMinimum: 0.0
          title: Rtp Clock Rate
          description: Horloge RTP en Hz pour la gigue (équivalent de --rtp-clock-rate)
          default: 8000
        idle_timeout_seconds:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Idle Timeout Seconds
          description: Seuil de coupure NAT/pare-feu silencieuse en secondes, défaut
            du cœur (60 s) si absent (équivalent de --idle-timeout-seconds)
        detect_duplicates:
          type: boolean
          title: Detect Duplicates
          description: 'true : compte les doublons inter-captures (équivalent de --detect-duplicates)'
          default: false
        exclude_duplicates:
          type: boolean
          title: Exclude Duplicates
          description: 'true : exclut les doublons inter-captures de l''analyse (équivalent
            de --exclude-duplicates, implique detect_duplicates)'
          default: false
        duplicate_threshold_ms:
          type: number
          minimum: 0.0
          title: Duplicate Threshold Ms
          description: Écart maximal en ms entre deux copies d'un même paquet (équivalent
            de --duplicate-threshold-ms)
          default: 1.0
        split_interfaces:
          type: boolean
          title: Split Interfaces
          description: 'true : un point par interface/section d''un pcapng multi-interfaces,
            étiqueté ETIQUETTE:INTERFACE (équivalent de --split-interfaces) ; `points_order`
            cite alors ces étiquettes'
          default: false
      type: object
      required:
      - files
      title: Body_upload_multi_capture_captures_multi_post
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorResponse
      description: Réponse d'erreur standard.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          default: ok
        version:
          type: string
          title: Version
          default: 1.0.0
      type: object
      title: HealthResponse
      description: Réponse du health check.
    MultiAnalysisSummary:
      properties:
        analysis_id:
          type: string
          title: Analysis Id
        status:
          type: string
          title: Status
          default: completed
        point_count:
          type: integer
          title: Point Count
          default: 0
        packet_count:
          type: integer
          title: Packet Count
          default: 0
        security_finding_count:
          type: integer
          title: Security Finding Count
          default: 0
        points:
          items:
            type: string
          type: array
          title: Points
          description: Points dans l'ordre amont -> aval retenu
        order_source:
          type: string
          title: Order Source
          description: « points_order » si l'ordre a été fourni, « auto » s'il a été
            déduit
          default: auto
        segments:
          items:
            $ref: '#/components/schemas/SegmentLoss'
          type: array
          title: Segments
      type: object
      required:
      - analysis_id
      title: MultiAnalysisSummary
      description: 'Résumé d''une analyse multi-points (issue #354).'
    SecurityFinding:
      properties:
        severity:
          type: string
          title: Severity
          default: ''
        category:
          type: string
          title: Category
          default: ''
        detail:
          type: string
          title: Detail
          default: ''
        point:
          anyOf:
          - type: string
          - type: 'null'
          title: Point
      type: object
      title: SecurityFinding
      description: Un constat de sécurité sérialisé.
    SecurityReport:
      properties:
        analysis_id:
          type: string
          title: Analysis Id
        findings:
          items:
            $ref: '#/components/schemas/SecurityFinding'
          type: array
          title: Findings
        service_fingerprints:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Service Fingerprints
        lateral_movement_events:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Lateral Movement Events
        dga_alerts:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Dga Alerts
        fast_flux_alerts:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Fast Flux Alerts
      type: object
      required:
      - analysis_id
      title: SecurityReport
      description: Rapport de sécurité pour GET /analyses/{id}/security.
    SegmentLoss:
      properties:
        segment:
          type: string
          title: Segment
          description: Libellé « amont -> aval », identique à celui des constats
        upstream:
          type: string
          title: Upstream
        downstream:
          type: string
          title: Downstream
        loss_count:
          type: integer
          title: Loss Count
          default: 0
        loss_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Loss Pct
          description: Pertes / paquets vus au point aval (%)
        seen_downstream:
          type: integer
          title: Seen Downstream
          default: 0
        off_path_count:
          type: integer
          title: Off Path Count
          description: Paquets hors chemin au point aval (#352), pas des pertes
          default: 0
        latency_samples:
          type: integer
          title: Latency Samples
          default: 0
        latency_avg_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Latency Avg Ms
      type: object
      required:
      - segment
      - upstream
      - downstream
      title: SegmentLoss
      description: 'Pertes et délai d''un segment amont -> aval (issue #354).


        Mêmes grandeurs que le tableau « Qualité par segment » des rapports :

        pertes comptées au point AVAL, taux rapporté aux paquets vus à ce point.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
