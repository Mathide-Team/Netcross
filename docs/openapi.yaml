  /comparisons:
    post:
      tags:
      - comparisons
      summary: Create Comparison
      description: 'Compare deux jeux de captures (baseline vs courant) et remonte
        les

        régressions/améliorations (issue #669).


        Équivalent de ``cross-capture-diff --baseline LAN=lan.pcap --current

        LAN=lan2.pcap``. ``baseline_files`` et ``current_files`` sont des

        listes de pcap étiquetés (même topologie attendue).'
      operationId: create_comparison_comparisons_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          description: 'true : attendre la fin de l''analyse (201 + résumé) au lieu
            de 202 + statut pending'
          default: false
          title: Wait
        description: 'true : attendre la fin de l''analyse (201 + résumé) au lieu
          de 202 + statut pending'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_comparison_comparisons_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
        '201':
          description: Analyse terminée (?wait=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSummary'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Content Too Large
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /comparisons/{comparison_id}:
    get:
      tags:
      - comparisons
      summary: Get Comparison
      description: 'Récupère le résultat d''une comparaison (écarts, triage, score
        de santé).


        Issue #669 : ``regression: true`` si au moins un écart est en régression.'
