        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/{analysis_id}/netflow:
    post:
      tags:
      - analyses
      summary: Netflow Summary
      description: 'Resume d''exports NetFlow v5 (issue #675, equivalent de ``--netflow``

        et ``--netflow-top``).


        Les fichiers NetFlow sont fournis dans la requete. Retourne le resume

        agrege (top flux, protocoles, destinations...).'
      operationId: netflow_summary_analyses__analysis_id__netflow_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      requestBody:
