      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      - name: consent
        in: query
        required: true
        schema:
          type: boolean
          description: 'true : l''utilisateur consent à la remontée d''un ticket anonymisé'
          title: Consent
        description: 'true : l''utilisateur consent à la remontée d''un ticket anonymisé'
      - name: kind
        in: query
        required: false
        schema:
