        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      - name: format
        in: query
        required: false
        schema:
          type: string
          description: 'Format d''export SIEM : cef, leef ou stix'
          default: cef
          title: Format
        description: 'Format d''export SIEM : cef, leef ou stix'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
