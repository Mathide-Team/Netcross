  /analyses/{analysis_id}/extract:
    post:
      tags:
      - analyses
      summary: Extract Contents
      description: 'Extraction des contenus (audio, video, documents) d''une analyse
        (issue

        #675, equivalent de ``--extract-contents`` et ``--extract-kinds``).


        Retourne une archive ZIP contenant les fichiers extraits et un manifeste.

        Les fichiers pcap sont fournis dans la requete (les captures originales

        sont supprimees apres analyse).'
      operationId: extract_contents_analyses__analysis_id__extract_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      requestBody:
